<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐞</text></svg>">

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Roboto:wght@400;500;700&display=swap');

:root{
  --tm-red:#fa194a;
  --tm-red-label:#ff042a;
  --tm-black:#000000;
  --tm-white:#ffffff;
  --tm-grey-light:#CACACA;
  --tm-grey-mid:#626262;
  --tm-grey-dark:#2C2C2C;
  --panel:#0d0d0d;
  --panel-2:#151515;
  --border:#2C2C2C;
  --viz-gold:#f5a623;
  --viz-blue:#3aa8ff;
  --viz-purple:#b06bff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--tm-black);
  color:var(--tm-white);
  font-family:'Roboto',sans-serif;
  font-size:15px;
  line-height:1.4;
  letter-spacing:0.01em;
  min-height:100vh;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--tm-grey-dark);border-radius:4px;}

h1,h2,h3{font-family:'Montserrat',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:0;margin:0 0 4px;color:var(--tm-white);}
h1{font-size:1.5rem;line-height:0.95;}
h2{font-size:1.1rem;line-height:1;}
h3{font-size:0.95rem;line-height:1.1;font-weight:700;}
p{font-family:'Roboto',sans-serif;font-weight:400;letter-spacing:0.01em;line-height:1.4;margin:0 0 8px;}
.tm-accent{color:var(--tm-red);}
.hl{font-style:italic;font-weight:900;text-transform:uppercase;color:var(--tm-red);}

a{color:var(--tm-white);}

#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:width 0.15s ease, flex-basis 0.15s ease;
}
.brand{padding:20px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.brand h1{font-size:1.3rem;}
.brand .sub{color:var(--tm-grey-light);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;}
#collapseBtn{background:none;border:1px solid var(--border);color:var(--tm-grey-light);border-radius:6px;width:24px;height:24px;flex:0 0 24px;padding:0;font-size:0.8rem;line-height:1;cursor:pointer;margin-top:2px;}
#collapseBtn:hover{color:var(--tm-white);border-color:var(--tm-grey-mid);}
nav{flex:1;padding:10px 0;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;color:var(--tm-grey-light);
  font-family:'Roboto',sans-serif;font-weight:700;text-transform:uppercase;font-size:0.78rem;letter-spacing:0.04em;
  border-left:3px solid transparent;white-space:nowrap;
}
.nav-item:hover{color:var(--tm-white);background:var(--panel-2);}
.nav-item.active{color:var(--tm-white);background:var(--panel-2);border-left-color:var(--tm-red);}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;color:var(--tm-red);}
.nav-item .ic svg{width:100%;height:100%;display:block;}
.nav-item .badge{margin-left:auto;background:var(--tm-red);color:#fff;font-size:0.65rem;padding:1px 6px;border-radius:10px;font-weight:800;}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:0.68rem;color:var(--tm-grey-mid);}

/* Collapsed state (manual toggle, remembered per browser) */
#sidebar.collapsed{width:64px;flex:0 0 64px;}
#sidebar.collapsed .label,#sidebar.collapsed .brand .sub,#sidebar.collapsed .brand h1,#sidebar.collapsed .side-foot,#sidebar.collapsed .badge{display:none;}
#sidebar.collapsed .brand{padding:16px 8px;justify-content:center;}
#sidebar.collapsed .nav-item{justify-content:center;padding:12px 4px;}
#sidebar.collapsed #collapseBtn{transform:rotate(180deg);}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:14px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(6px);z-index:5;
}
#topbar .date{font-size:0.78rem;color:var(--tm-grey-light);text-transform:uppercase;letter-spacing:0.06em;}
.loc-toggle{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:3px;}
.loc-btn{padding:5px 12px;border-radius:16px;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--tm-grey-light);cursor:pointer;border:none;background:none;}
.loc-btn.active{background:var(--tm-red);color:#fff;}
#status-pill{font-size:0.68rem;color:var(--tm-grey-mid);}
#status-pill.ok::before{content:"● ";color:#3ddc84;}
#status-pill.bad::before{content:"● ";color:var(--tm-red);}

#view{padding:22px 24px 60px;max-width:1100px;}

/* Cards / grid */
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-2{grid-template-columns:1fr;}}
@media(max-width:600px){.grid.cols-4{grid-template-columns:1fr;}#sidebar{width:64px;flex:0 0 64px;}#sidebar .label,.brand .sub,.brand h1{display:none;}.brand{padding:16px 8px;}.nav-item{justify-content:center;padding:12px 4px;}#view{padding:16px;}}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
.card.kpi{border-top:3px solid var(--tm-red);}
.kpi .num{font-family:'Montserrat',sans-serif;font-weight:900;font-size:2rem;line-height:1;margin:6px 0 2px;}
.kpi .sub{font-size:0.72rem;color:var(--tm-grey-light);text-transform:uppercase;letter-spacing:0.04em;}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;margin-top:8px;}
.pill.behind{background:var(--tm-red);color:#fff;}
.pill.ontrack{background:transparent;border:1px solid var(--tm-white);color:var(--tm-white);}
.pill.ahead{background:transparent;border:1px solid #3ddc84;color:#3ddc84;}
.pill.open{background:var(--tm-red);color:#fff;}
.pill.resolved{background:transparent;border:1px solid var(--tm-grey-light);color:var(--tm-grey-light);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.section-title h2{margin:0;}
.muted{color:var(--tm-grey-light);font-size:0.8rem;}

button,.btn{
  font-family:'Roboto',sans-serif;font-weight:700;text-transform:uppercase;font-size:0.75rem;letter-spacing:0.03em;
  background:var(--tm-red);color:#fff;border:none;border-radius:6px;padding:9px 14px;cursor:pointer;
}
button.ghost,.btn.ghost{background:transparent;border:1px solid var(--tm-grey-mid);color:var(--tm-white);}
button.small{padding:5px 10px;font-size:0.68rem;}
button:disabled{opacity:0.4;cursor:default;}
button.danger{background:transparent;border:1px solid var(--tm-red);color:var(--tm-red);}

input,textarea,select{
  width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--tm-white);
  padding:9px 10px;border-radius:6px;font-family:'Roboto',sans-serif;font-size:0.85rem;
}
input:focus,textarea:focus,select:focus{outline:1px solid var(--tm-red);}
label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--tm-grey-light);display:block;margin-bottom:4px;}
.field{margin-bottom:10px;}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.form-row.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:600px){.form-row,.form-row.cols-3{grid-template-columns:1fr;}}
.form-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}

hr.tm-divider{border:none;border-top:1px solid var(--tm-red);margin:1.2rem 0;}

table{width:100%;border-collapse:collapse;font-size:0.85rem;}
th{text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--tm-grey-light);padding:8px 8px;border-bottom:1px solid var(--border);}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.list-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
.list-item .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.tag{display:inline-block;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.03em;padding:2px 8px;border:1px solid var(--tm-grey-mid);border-radius:10px;color:var(--tm-grey-light);margin-right:4px;}
.empty{color:var(--tm-grey-mid);font-size:0.85rem;padding:20px 0;text-align:center;}
.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.checklist-item:last-child{border-bottom:none;}
.checklist-item.done p{text-decoration:line-through;color:var(--tm-grey-mid);}
.checklist-item input[type=checkbox]{width:18px;height:18px;flex:0 0 18px;accent-color:var(--tm-red);}
.checklist-item p{margin:0;flex:1;}
.icon-btn{background:none;border:none;color:var(--tm-grey-light);cursor:pointer;padding:2px 6px;font-size:0.9rem;}
.icon-btn:hover{color:var(--tm-red);}
.mono{font-family:monospace;letter-spacing:0.02em;}
.pw-mask{letter-spacing:2px;}
.search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-row input{flex:1;min-width:180px;}
.filter-chip{padding:6px 12px;border-radius:14px;border:1px solid var(--tm-grey-mid);font-size:0.7rem;text-transform:uppercase;font-weight:700;letter-spacing:0.03em;cursor:pointer;color:var(--tm-grey-light);background:transparent;}
.filter-chip.active{background:var(--tm-red);border-color:var(--tm-red);color:#fff;}
.bl-item{border-left:3px solid var(--tm-red);}
.upcoming{border-left:3px solid var(--tm-red);}
.past{opacity:0.55;}
.timestamp{font-size:0.68rem;color:var(--tm-grey-mid);}

/* Focus hero */
.greeting{font-size:1.9rem;}
.promo-banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:rgba(250,25,74,0.06);border:1px solid rgba(250,25,74,0.35);border-radius:12px;padding:14px 18px;margin:14px 0;
}
.promo-tag{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--tm-red);border:1px solid var(--tm-red);border-radius:6px;padding:3px 8px;white-space:nowrap;}
.focus-pills{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
.focus-pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:8px 16px;font-size:0.82rem;}
.focus-pill .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
.focus-pill b{font-family:'Montserrat',sans-serif;}
.shift-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.shift-chip{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:0.78rem;font-weight:700;}
.ring-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.ring-card .top{display:flex;align-items:center;gap:14px;}
.ring-card h3{margin:0;}
.ring-card .stat-row{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--tm-grey-light);padding:4px 0;border-top:1px solid var(--border);}
.ring-card .stat-row b{color:var(--tm-white);font-weight:700;}
.bottom-banner{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--tm-red);border-radius:10px;padding:14px 18px;margin-top:6px;}
.settings-card{margin-top:22px;opacity:0.9;}

</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
</head>
<body>
<div id="authGate" style="display:none;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;">
  <div style="width:100%;max-width:320px;padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:12px;">
    <h1 style="font-size:1.3rem;margin-bottom:4px;">HOST <span class="tm-accent">HUB</span></h1>
    <p class="muted" style="margin-bottom:18px;">Sign in to continue.</p>
    <div class="field"><label>Email</label><input id="gateEmail" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="gatePassword" type="password" placeholder="Password"></div>
    <button id="gateSignInBtn" style="width:100%;margin-top:4px;">Sign in</button>
    <p id="gateError" style="color:var(--tm-red);font-size:0.78rem;margin-top:10px;"></p>
  </div>
</div>
<div id="app" style="display:none;">
  <div id="sidebar">
    <div class="brand">
      <div>
        <h1>HOST <span class="tm-accent">HUB</span></h1>
        <div class="sub">West Ladies</div>
      </div>
      <button id="collapseBtn" title="Collapse sidebar">«</button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">Shared live dashboard.<br>Everyone sees the same data.</div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="date" id="topdate"></div>
      <input id="whoAmI" placeholder="Your name" style="width:120px;padding:6px 10px;font-size:0.78rem;">
      <div id="status-pill">connecting…</div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;max-width:90vw;padding:12px 18px;border-radius:8px;font-size:0.85rem;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,0.4);"></div>

<script>
/* ---------------- constants ---------------- */
/* single-location deployment: West Ladies */
const KPIS = [
  {key:"signed", label:"Signed"},
  {key:"clubConversions", label:"Club Conversions"},
  {key:"transactions", label:"Transactions"}
];
const TASK_CATEGORIES = [
  {key:"opening", label:"Opening"},
  {key:"midday", label:"Mid Day"},
  {key:"closing", label:"Closing"}
];
const WEEKDAYS = [
  {key:"monday", label:"Monday"},
  {key:"tuesday", label:"Tuesday"},
  {key:"wednesday", label:"Wednesday"},
  {key:"thursday", label:"Thursday"},
  {key:"friday", label:"Friday"},
  {key:"saturday", label:"Saturday"},
  {key:"sunday", label:"Sunday"}
];
const ICONS = {
  focus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
  sales: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,17 9,11 13,14 20,5"/><polyline points="14,5 20,5 20,11"/></svg>`,
  updates: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6l-5 4H4a1 1 0 0 0-1 1z"/><path d="M16 8a4 4 0 0 1 0 8"/></svg>`,
  tasks: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l1.5 1.5L8 5"/><line x1="11" y1="6" x2="20" y2="6"/><path d="M4 12l1.5 1.5L8 11"/><line x1="11" y1="12" x2="20" y2="12"/><path d="M4 18l1.5 1.5L8 17"/><line x1="11" y1="18" x2="20" y2="18"/></svg>`,
  shift: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/></svg>`,
  events: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>`,
  team: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.5"/><path d="M15 14.2c2.9 0.4 5 2.8 5 5.8"/></svg>`,
  logbook: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>`,
  passwords: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="14" r="4"/><path d="M10 11l9-9"/><path d="M15 6l3 3"/><path d="M18 3l3 3"/></svg>`,
  blacklist: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  issuetracker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>`,
  activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,12 8,12 10,18 14,6 16,12 21,12"/></svg>`
};
const UI_ICONS = {
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>`,
  email: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>`,
  eye: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6 0 10 7 10 7a17.7 17.7 0 0 1-3.2 3.9M6.6 6.6C4 8.3 2 12 2 12s4 7 10 7a9.8 9.8 0 0 0 5-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`,
  copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`
};
function icon(name, size){
  size = size || 14;
  return `<span style="display:inline-flex;vertical-align:-2px;width:${size}px;height:${size}px;color:var(--tm-red);">${UI_ICONS[name]||''}</span>`;
}
const NAV = [
  {id:"focus", label:"Dashboard"},
  {id:"sales", label:"Sales"},
  {id:"updates", label:"Updates"},
  {id:"tasks", label:"Daily Tasks"},

/* ---------------- KPI targets & daily totals math ---------------- */
function dayType(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay(); // 0 Sun .. 6 Sat
  return day===0 ? "sunday" : day===6 ? "saturday" : "weekday";
}
function periodDefaults(){
  const now = new Date();
  const start = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-01";
  const endD = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const end = endD.getFullYear()+"-"+pad(endD.getMonth()+1)+"-"+pad(endD.getDate());
  return {start, end};
}
function getPeriod(){
  const cfg = state.kpiConfig;
  if(cfg && cfg.periodStart && cfg.periodEnd) return {start:cfg.periodStart, end:cfg.periodEnd};
  return periodDefaults();
}
function dateRange(start,end){
  const out=[]; let d = new Date(start+"T00:00:00"); const endD = new Date(end+"T00:00:00");
  let guard=0;
  while(d<=endD && guard<400){ out.push(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())); d.setDate(d.getDate()+1); guard++; }
  return out;
}
function targetFor(kpiKey, dateStr){
  const cfg = state.kpiConfig.kpis && state.kpiConfig.kpis[kpiKey];
  if(!cfg || !cfg.monthly) return 0;
  const {start,end} = getPeriod();
  const totalDays = dateRange(start,end).length || 1;
  return cfg.monthly / totalDays;
}
function monthlyTargetTotal(kpiKey){
  const cfg = state.kpiConfig.kpis && state.kpiConfig.kpis[kpiKey];
  return (cfg && Number(cfg.monthly)) || 0;
}
function targetToDateTotal(kpiKey){
  const {start,end} = getPeriod();
  const today = todayStr();
  const cutoff = today<start ? start : (today>end ? end : today);
  const elapsedDays = dateRange(start,cutoff).length;
  return targetFor(kpiKey, cutoff) * elapsedDays;
}
function dailyTotalsMap(){
  const m={}; state.dailyTotals.forEach(r=>{ m[r.id]=r; }); return m;
}
function latestActual(kpiKey){
  const {start} = getPeriod();
  const today = todayStr();
  const map = dailyTotalsMap();
  let val = 0;
  dateRange(start, today<start?start:today).forEach(d=>{
    const rec = map[d];
    if(rec && rec[kpiKey]!=null && rec[kpiKey]!=="") val = Number(rec[kpiKey]);
  });
  return val;
}
function thatDayValue(kpiKey, dateStr, datesInOrder){
  const map = dailyTotalsMap();
  const rec = map[dateStr];
  if(!rec || rec[kpiKey]==null || rec[kpiKey]==="") return null;
  const idx = datesInOrder.indexOf(dateStr);
  let prevVal = 0;
  if(idx>0){
    const p = map[datesInOrder[idx-1]];
    if(p && p[kpiKey]!=null && p[kpiKey]!=="") prevVal = Number(p[kpiKey]);
  }
  return Number(rec[kpiKey]) - prevVal;
}
function computeKpiSummary(){
  return KPIS.map(k=>{
    const target = monthlyTargetTotal(k.key);
    const actual = latestActual(k.key);
    const targetToDate = targetToDateTotal(k.key);
    const vsPace = actual - targetToDate;
    const pct = target>0 ? Math.round((actual/target)*100) : 0;
    return {...k, target, actual, targetToDate, vsPace, pct};
  });
}

function ringSVG(pct, color, centerText, size, subText){
  size = size||88;
  const stroke = Math.round(size*0.095);
  const r = (size-stroke)/2, cx=size/2, cy=size/2;
  const c = 2*Math.PI*r;
  const p = Math.max(0, Math.min(100, pct||0));
  const off = c - (p/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="50%" y="${subText?'46%':'52%'}" text-anchor="middle" dominant-baseline="middle" fill="#fff"
      font-family="Montserrat,sans-serif" font-weight="900" font-size="${size*0.20}">${escapeHtml(centerText)}</text>
    ${subText? `<text x="50%" y="66%" text-anchor="middle" dominant-baseline="middle" fill="var(--tm-grey-light)" font-family="Roboto,sans-serif" font-size="${size*0.11}">${escapeHtml(subText)}</text>` : ``}
  </svg>`;
}

function renderFocus(){
  const kpis = computeKpiSummary();
  const {start, end} = getPeriod();
  const today = todayStr();
  const daysRemaining = dateRange(today<start?start:today, end).length;
  const openIssues = state.logbook.filter(l=>l.status!=="resolved").length;
  const upcoming = upcomingEvents(3);

  const dailyMap = dailyTotalsMap();
  const yesterdayRec = dailyMap[yesterdayStr()] || {};
  const todaysShiftLogs = state.shiftLogs.filter(s=>s.date===today);
  const onShiftHosts = [...new Set(todaysShiftLogs.map(s=>s.host).filter(Boolean))];
  const todayShiftTotals = sumShift(todaysShiftLogs);
  const latestNote = state.shiftLogs.filter(l=>l.note && l.note.trim()).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))[0];

  const recentUpdates = state.updates.slice(0,4);

  const promo = state.config.promo;
  const promoActive = promo && promo.title && (!promo.until || promo.until >= today);

  const kSigned = kpis.find(k=>k.key==="signed");
  const kClub = kpis.find(k=>k.key==="clubConversions");
  const kTrans = kpis.find(k=>k.key==="transactions");
  const rv = state.config.reviews || {};

  const salesTarget = kSigned.target + kClub.target + kTrans.target;

        </div>

        <button type="submit">Save settings</button>
      </form>
    </div>` : ``}
  `;
}
function sumShift(logs){
  const fields=["handled","trialSignups","walkInSignups","dayPasses","googleReviews"];
  const out={}; fields.forEach(f=>out[f]=0);
  logs.forEach(l=>fields.forEach(f=>out[f]+=Number(l[f])||0));
  return out;
}
function upcomingEvents(days){
  const now = new Date(todayStr()+"T00:00:00");
  const end = new Date(now.getTime()+days*86400000);
  return state.events.filter(e=>{
    const d = new Date(e.date+"T00:00:00");
    return d>=now && d<=end;
  }).sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------------- SALES ---------------- */
function renderSales(){
  const admin = effectiveAdmin();
  const kpis = computeKpiSummary();
  const {start, end} = getPeriod();
  const today = todayStr();
  const cfg = state.kpiConfig.kpis || {};

  const paceLine = k=>{
    const v=k.vsPace, sign=v>=0?"+":"";
    return `<div class="muted" style="color:${v>=0?'#3ddc84':'var(--tm-red)'};margin-top:6px;">${sign}${v.toFixed(1)} vs pace-to-date</div>`;
  };
  const monthlyCards = kpis.map(k=>{
    const pct = k.target>0? Math.min(100,Math.round((k.actual/k.target)*100)) : 0;
    return `
    <div class="card" style="border-top:3px solid var(--border);">
      <div class="sub muted" style="letter-spacing:0.05em;">${k.label.toUpperCase()}</div>
      <div class="num" style="margin-top:6px;">${k.actual}<span style="font-size:1.1rem;color:var(--tm-grey-light);"> / ${k.target||"–"}</span></div>
      <div style="background:var(--border);border-radius:4px;height:6px;margin-top:10px;overflow:hidden;">
        <div style="background:${k.vsPace>=0?'#3ddc84':'var(--tm-red)'};height:100%;width:${pct}%;"></div>
      </div>
      ${paceLine(k)}
    </div>`;
  }).join("");

  const todayCards = kpis.map(k=>{
    const t = targetFor(k.key, today);
    const rec = dailyTotalsMap()[today];
    const logged = rec && rec[k.key]!=null && rec[k.key]!=="";
    const delta = logged? thatDayValue(k.key, today, dateRange(start, today)) : null;
    return `
    <div class="card">
      <div class="sub muted" style="letter-spacing:0.05em;">${k.label.toUpperCase()}</div>
      <div class="num" style="margin-top:6px;">${Math.round(t)}</div>
      ${logged
        ? `<div class="muted" style="color:${(delta-t)>=0?'#3ddc84':'var(--tm-red)'};margin-top:6px;">Logged: ${delta} (${(delta-t)>=0?'+':''}${(delta-t).toFixed(1)})</div>`
        : `<div class="muted" style="margin-top:6px;">not logged yet today</div>`}
    </div>`;
  }).join("");

  const dates = dateRange(start, end);
  const dailyMap = dailyTotalsMap();
  const dayRows = dates.map(d=>{
    const rec = dailyMap[d] || {};
    const dt = dayType(d);
    const isWeekend = dt!=="weekday";
    const dLabel = new Date(d+"T00:00:00");
    const dayNum = dLabel.getDate();
    const monthShort = dLabel.toLocaleDateString(undefined,{month:'short'});
    const weekdayShort = dLabel.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase();
    const cells = KPIS.map(k=>{
      const target = targetFor(k.key,d);
      const val = rec[k.key];
      const hasVal = val!=null && val!=="";
      const delta = hasVal? thatDayValue(k.key,d,dates) : null;
      const diff = hasVal? (delta-target) : null;
      return `
        <td>${target.toFixed(1)}</td>
        <td>${admin
          ? `<input type="number" step="any" class="mono" style="width:70px;padding:4px 6px;" data-daily-date="${d}" data-daily-kpi="${k.key}" value="${hasVal? val : ''}" placeholder="–">`
          : `<span class="mono">${hasVal? val : '–'}</span>`}</td>
        <td>${hasVal? delta.toFixed(1) : '–'}</td>
        <td style="color:${diff==null?'var(--tm-grey-mid)':(diff>=0?'#3ddc84':'var(--tm-red)')}">${diff==null?'–':(diff>=0?'+':'')+diff.toFixed(1)}</td>`;
    }).join("");
    return `<tr style="${d===today?'background:var(--panel-2);':''}">
      <td style="white-space:nowrap;${isWeekend?'color:var(--tm-red);':''}"><b>${dayNum} ${monthShort}</b><br><span class="muted" style="${isWeekend?'color:inherit;':''}">${weekdayShort}</span></td>
      ${cells}
    </tr>`;
  }).join("");

  return `
    <h1>Monthly Targets</h1>
    <p class="muted">${niceDate(start)} – ${niceDate(end)} · ${admin ? "tap any field in Day by Day to log the day" : "updated by admin each morning"}</p>

    ${admin? `
    <button class="ghost small" id="toggleEditTargets" style="margin-bottom:14px;">Edit targets & dates</button>
    <div id="editTargetsWrap" style="display:${state.uiShowTargetsForm? 'block':'none'};">
      <div class="form-card">
        <h3>Targets & period</h3>
        <form id="kpiTargetsForm">
          <div class="form-row">
            <div class="field"><label>Period start</label><input type="date" name="periodStart" value="${escapeHtml(start)}" required></div>
            <div class="field"><label>Period end</label><input type="date" name="periodEnd" value="${escapeHtml(end)}" required></div>
          </div>
          <table style="margin-top:8px;">
            <tr><th>KPI</th><th>Monthly target</th></tr>
            ${KPIS.map(k=>`<tr>
              <td>${k.label}</td>
              <td><input type="number" step="any" min="0" name="${k.key}__monthly" value="${cfg[k.key]?.monthly ?? ''}" placeholder="0"></td>
            </tr>`).join("")}
          </table>
          <p class="muted" style="margin-top:8px;">Enter the total you're aiming for this period — the daily target is worked out automatically by dividing it evenly across every day in the period.</p>
          <button type="submit" style="margin-top:6px;">Save targets & dates</button>
        </form>
      </div>
    </div>` : ``}

    <div class="grid cols-4" style="grid-template-columns:repeat(3,1fr);">${monthlyCards}</div>

    <div class="row" style="display:flex;justify-content:space-between;align-items:center;margin:14px 0;flex-wrap:wrap;gap:10px;">
      <div style="display:flex;gap:18px;font-size:0.8rem;color:var(--tm-grey-light);">
        <span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc84;margin-right:6px;"></span>Ahead of / on pace</span>
        <span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tm-red);margin-right:6px;"></span>Behind pace</span>
      </div>
      ${admin? (state.uiPendingConfirm==='clearActuals'
        ? `<span><button class="small danger" id="clearActualsConfirmBtn">Confirm clear</button> <button class="small ghost" id="clearActualsCancelBtn">Cancel</button></span>`
        : `<button class="icon-btn" id="clearActualsBtn" style="text-decoration:underline;color:var(--tm-grey-light);">Clear all entered actuals</button>`) : ``}
    </div>

    <hr class="tm-divider">
    <div class="section-title"><h2>Today's Targets</h2></div>
    <div class="grid cols-4" style="grid-template-columns:repeat(3,1fr);">${todayCards}</div>

    ${admin? `
    <hr class="tm-divider">
    <div class="section-title"><h2>Day by Day</h2></div>
    <p class="muted">Enter the running total-to-date for each day, exactly as your dashboard shows it — we'll work out that day's own numbers for you.</p>
    <div style="overflow-x:auto;">
      <table style="min-width:820px;">
        <tr>
          <th>Day</th>
          ${KPIS.map(k=>`<th colspan="4">${k.label}</th>`).join("")}
        </tr>
        <tr>
          <th></th>
          ${KPIS.map(()=>`<th>Target</th><th>Total to date</th><th>That day</th><th>Diff</th>`).join("")}
        </tr>
        ${dayRows}
      </table>
    </div>` : ``}

    ${admin? `
    <hr class="tm-divider">
    <div class="section-title"><h2>Team Message</h2></div>
    <p class="muted">Fills in today's numbers automatically. Edit freely before sending — your edits stay put until you hit Regenerate.</p>
    <div class="form-card">
      <textarea id="msgBox" rows="12" style="font-family:monospace;white-space:pre-wrap;">${escapeHtml(state.uiMessageDraft!=null ? state.uiMessageDraft : computeDailyMessage())}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button type="button" class="ghost" id="msgRegenBtn">Regenerate numbers</button>
        <button type="button" id="msgCopyBtn">Copy message</button>
      </div>
      <span class="muted" id="msgCopyStatus" style="margin-left:4px;"></span>
    </div>
    <details style="margin-top:10px;">
      <summary class="muted" style="cursor:pointer;">Edit wording (greeting, promo text)</summary>
      <form id="msgTemplateForm" style="margin-top:10px;">
        <div class="field"><label>Greeting</label><input name="greeting" value="${escapeHtml(state.config.dailyMessage?.greeting || 'Hi Ladies!')}"></div>
        <div class="field"><label>Promo block</label><textarea name="promoBlock" rows="4">${escapeHtml(state.config.dailyMessage?.promoBlock!=null ? state.config.dailyMessage.promoBlock : DEFAULT_PROMO_BLOCK)}</textarea></div>
        <div class="field"><label>Student block</label><textarea name="studentBlock" rows="2">${escapeHtml(state.config.dailyMessage?.studentBlock!=null ? state.config.dailyMessage.studentBlock : DEFAULT_STUDENT_BLOCK)}</textarea></div>
        <button type="submit">Save wording</button>
      </form>
    </details>` : ``}
  `;
}

/* ---------------- ACTIVITY LOG (admin) ---------------- */
function computeMonthlyReport(monthStr){
  const shiftInMonth = state.shiftLogs.filter(l=>l.date && l.date.startsWith(monthStr));
  const activityInMonth = state.activityLog.filter(e=>{
    const d = new Date(e.timestamp);
    return monthKey(d)===monthStr;
  });
  const people = new Set();
  shiftInMonth.forEach(l=>people.add(l.host||"Unknown"));
  activityInMonth.forEach(e=>people.add(e.by||"Unknown"));
  const rows = [...people].map(name=>{
    const shifts = shiftInMonth.filter(l=>(l.host||"Unknown")===name);
    const totals = sumShift(shifts);
    const tasksDone = activityInMonth.filter(e=>e.by===name && e.type==='checklist').length;
    const cleaningDone = activityInMonth.filter(e=>e.by===name && e.type==='cleaning').length;
    return {name, ...totals, tasksDone, cleaningDone, shiftsLogged: shifts.length};
  });
  rows.sort((a,b)=>b.trialSignups - a.trialSignups);
  return rows;
}

/* ---------------- write helpers ---------------- */
function showToast(msg, isError){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.style.background = isError ? 'var(--tm-red)' : '#3ddc84';
  el.style.color = isError ? '#fff' : '#000';
  el.style.display = 'block';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.style.display = 'none'; }, isError ? 5000 : 2500);
}
async function safeAdd(col,data){
  if(!db){ showToast("Live sync isn't available right now, so this can't be saved.", true); return false; }
  try{ await db.collection(col).add(data); return true; }
  catch(e){ showToast("Couldn't save — "+(e && e.message || "try again"), true); return false; }
}
async function safeSet(path,data){
  if(!db){ showToast("Live sync isn't available right now, so this can't be saved.", true); return false; }
  try{ await db.doc(path).set(data); return true; }
  catch(e){ showToast("Couldn't save — "+(e && e.message || "try again"), true); return false; }
}
async function safeUpdate(path,data){
  if(!db){ showToast("Live sync isn't available right now, so this can't be saved.", true); return false; }
  try{ await db.doc(path).update(data); return true; }
  catch(e){
    try{ await db.doc(path).set(data); return true; }
    catch(e2){ showToast("Couldn't save — "+(e2 && e2.message || "try again"), true); return false; }
  }
}
async function safeDelete(path){
  if(!db){ showToast("Live sync isn't available right now, so this can't be deleted.", true); return false; }
  try{ await db.doc(path).delete(); return true; }
  catch(e){ showToast("Couldn't delete — "+(e && e.message || "try again"), true); return false; }
}

/* ---------------- event wiring per view ---------------- */
function wireTabEvents(){
  const v = document.getElementById('view');

  v.querySelectorAll('[data-goto-tab]').forEach(b=>b.addEventListener('click', ()=>{
    state.tab = b.dataset.gotoTab;
    buildNav(); render();
  }));

  // FOCUS
  const dashSettingsForm = v.querySelector('#dashSettingsForm');
  if(dashSettingsForm) dashSettingsForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(dashSettingsForm);
    const promoTitle = fd.get('promoTitle')||"";
    const payload = {
      promo: promoTitle ? {
        title: promoTitle, message: fd.get('promoMessage')||"", code: fd.get('promoCode')||"", until: fd.get('promoUntil')||""
      } : null,
      reviews: {
        rating: fd.get('rating')? Number(fd.get('rating')) : null,
        totalReviews: fd.get('totalReviews')? Number(fd.get('totalReviews')) : null,
        ratingGoal: fd.get('ratingGoal')? Number(fd.get('ratingGoal')) : null,
        targetLabel: fd.get('targetLabel')||""
      },
      dailyMessage: state.config.dailyMessage || {}
    };
    await safeSet('config/dashboard', payload);
  });

  // SALES
  const toggleEditTargets = v.querySelector('#toggleEditTargets');
  if(toggleEditTargets) toggleEditTargets.addEventListener('click', ()=>{
    state.uiShowTargetsForm = !state.uiShowTargetsForm;
    render();
  });
  const kpiTargetsForm = v.querySelector('#kpiTargetsForm');
  if(kpiTargetsForm) kpiTargetsForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(kpiTargetsForm);
    const kpisPayload = {};
    KPIS.forEach(k=>{
      kpisPayload[k.key] = { monthly: Number(fd.get(`${k.key}__monthly`))||0 };
    });
    await safeSet('config/kpiTargets', {
      periodStart: fd.get('periodStart'), periodEnd: fd.get('periodEnd'), kpis: kpisPayload
    });
    state.uiShowTargetsForm = false;
  });
  const clearActualsBtn = v.querySelector('#clearActualsBtn');
  if(clearActualsBtn) clearActualsBtn.addEventListener('click', ()=>{
    state.uiPendingConfirm = 'clearActuals';
    render();
  });
  const clearActualsCancelBtn = v.querySelector('#clearActualsCancelBtn');
  if(clearActualsCancelBtn) clearActualsCancelBtn.addEventListener('click', ()=>{
    state.uiPendingConfirm = null;
    render();
  });
  const clearActualsConfirmBtn = v.querySelector('#clearActualsConfirmBtn');
  if(clearActualsConfirmBtn) clearActualsConfirmBtn.addEventListener('click', async ()=>{
    state.uiPendingConfirm = null;
    const {start,end} = getPeriod();
    const dates = dateRange(start, end);
    let ok = true;
    for(const d of dates){
      if(state.dailyTotals.find(r=>r.id===d)){ const r = await safeDelete('dailyTotals/'+d); if(!r) ok=false; }
    }
    if(ok) showToast("Cleared this period's entered totals.");
    render();
  });
  v.querySelectorAll('[data-daily-date]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const date = inp.dataset.dailyDate, kpi = inp.dataset.dailyKpi;
      const val = inp.value===''? null : Number(inp.value);
      const ok = await safeUpdate('dailyTotals/'+date, {date, [kpi]: val});
      if(ok && val!=null){
        const kLabel = (KPIS.find(k=>k.key===kpi)||{}).label || kpi;
        logActivity('sales', `${kLabel}: total to date ${val} (${niceDate(date)})`);
      }
    });
  });

  const msgBox = v.querySelector('#msgBox');
  if(msgBox) msgBox.addEventListener('input', ()=>{ state.uiMessageDraft = msgBox.value; });
  const msgRegenBtn = v.querySelector('#msgRegenBtn');
  if(msgRegenBtn) msgRegenBtn.addEventListener('click', ()=>{
    state.uiMessageDraft = computeDailyMessage();
    render();
  });
  const msgCopyBtn = v.querySelector('#msgCopyBtn');
  if(msgCopyBtn) msgCopyBtn.addEventListener('click', ()=>{
    const statusEl = v.querySelector('#msgCopyStatus');
    const text = msgBox ? msgBox.value : computeDailyMessage();
    if(navigator.clipboard) {
      navigator.clipboard.writeText(text).then(()=>{
        if(statusEl){ statusEl.textContent = "Copied!"; setTimeout(()=>{ if(statusEl) statusEl.textContent=""; }, 2000); }
      }).catch(()=>{ if(statusEl) statusEl.textContent = "Couldn't copy — select and copy manually."; });
    }
  });
  const msgTemplateForm = v.querySelector('#msgTemplateForm');
  if(msgTemplateForm) msgTemplateForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(msgTemplateForm);
    await safeSet('config/dashboard', {
      promo: state.config.promo, reviews: state.config.reviews,
      dailyMessage: { greeting: fd.get('greeting')||"", promoBlock: fd.get('promoBlock')||"", studentBlock: fd.get('studentBlock')||"" }
    });
    state.uiMessageDraft = null;
  });

  // UPDATES
  const updateForm = v.querySelector('#updateForm');
  if(updateForm) updateForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(updateForm);
    await safeAdd('updates', {author:fd.get('author')||"", text:fd.get('text'), timestamp:Date.now()});
    updateForm.reset();
  });
  v.querySelectorAll('[data-del-update]').forEach(b=>b.addEventListener('click',()=>safeDelete('updates/'+b.dataset.delUpdate)));

  // TASKS (recurring Opening / Mid Day / Closing checklist)
  const templateForm = v.querySelector('#templateForm');
  if(templateForm) templateForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(templateForm);
    await safeAdd('taskTemplates', {category:fd.get('category'), text:fd.get('text'), order:Date.now()});
    templateForm.reset();
  });
  v.querySelectorAll('[data-toggle-checklist]').forEach(cb=>cb.addEventListener('change', async ()=>{
    const id = cb.dataset.toggleChecklist;
    const path = `taskCompletions/${todayStr()}_${id}`;
    if(cb.checked){
      const ok = await safeSet(path, {date:todayStr(), templateId:id, done:true, doneAt:Date.now()});
      if(ok){
        const taskItem = state.taskTemplates.find(t=>t.id===id);
        const cleanItem = state.cleaningTemplates.find(t=>t.id===id);
        if(taskItem) logActivity('checklist', `Checked off: ${taskItem.text}`);
        else if(cleanItem) logActivity('cleaning', `Cleaned: ${cleanItem.area} (${cleanItem.shift})`);
      }
    } else {
      await safeDelete(path);
    }
  }));
  v.querySelectorAll('[data-del-template]').forEach(b=>b.addEventListener('click',()=>safeDelete('taskTemplates/'+b.dataset.delTemplate)));

  const cleaningForm = v.querySelector('#cleaningForm');
  if(cleaningForm) cleaningForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(cleaningForm);
    await safeAdd('cleaningTemplates', {day:fd.get('day'), shift:fd.get('shift'), area:fd.get('area'), order:Date.now()});
    cleaningForm.reset();
  });
  v.querySelectorAll('[data-del-cleaning]').forEach(b=>b.addEventListener('click',()=>safeDelete('cleaningTemplates/'+b.dataset.delCleaning)));

  // SHIFT
  const shiftForm = v.querySelector('#shiftForm');
  if(shiftForm){
    shiftForm.addEventListener('input', ()=>{
      const fd = new FormData(shiftForm);
      state.shiftDraft = {host: fd.get('host')||"", note: fd.get('note')||""};
      SHIFT_FIELDS.forEach(f=>{ state.shiftDraft[f.key] = fd.get(f.key)||""; });
    });
    shiftForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(shiftForm);
      const data = {host:fd.get('host'), date:todayStr(), timestamp:Date.now(), note:fd.get('note')||""};
      SHIFT_FIELDS.forEach(f=>data[f.key]=Number(fd.get(f.key))||0);
      const ok = await safeAdd('shiftLogs', data);
      if(ok){
        state.shiftDraft = {host:"", note:""};
        showToast("Shift entry submitted.");
        render();
      }
    });
  }
  v.querySelectorAll('[data-del-shift]').forEach(b=>b.addEventListener('click',()=>safeDelete('shiftLogs/'+b.dataset.delShift)));

  // EVENTS
  const eventForm = v.querySelector('#eventForm');
  if(eventForm) eventForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(eventForm);
    await safeAdd('events', {
      type:fd.get('type'), title:fd.get('title'), date:fd.get('date'),
      recurring: fd.get('recurring')==='on', notes: fd.get('notes')||""
    });
    eventForm.reset();
  });
  v.querySelectorAll('[data-del-event]').forEach(b=>b.addEventListener('click',()=>safeDelete('events/'+b.dataset.delEvent)));

  // TEAM
  const teamForm = v.querySelector('#teamForm');
  if(teamForm) teamForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(teamForm);
    await safeAdd('team', {name:fd.get('name'), role:fd.get('role')||"Host", phone:fd.get('phone')||"", email:fd.get('email')||""});
    teamForm.reset();
  });
  v.querySelectorAll('[data-del-team]').forEach(b=>b.addEventListener('click',()=>safeDelete('team/'+b.dataset.delTeam)));

  // LOGBOOK
  const logForm = v.querySelector('#logForm');
  if(logForm) logForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(logForm);
    await safeAdd('logbook', {
      category:fd.get('category'), reportedBy:fd.get('reportedBy')||"",
      title:fd.get('title'), description:fd.get('description')||"", status:"open", createdAt:Date.now()
    });
    logForm.reset();
  });
  const logSearch = v.querySelector('#logSearchInput');
  if(logSearch) logSearch.addEventListener('input', ()=>{ state.logbookSearch = logSearch.value; render(); logSearch.focus(); logSearch.setSelectionRange(logSearch.value.length,logSearch.value.length); });
  v.querySelectorAll('[data-logcat]').forEach(b=>b.addEventListener('click',()=>{ state.logbookCat=b.dataset.logcat; render(); }));
  v.querySelectorAll('[data-logstatus]').forEach(b=>b.addEventListener('click',()=>{ state.logbookStatus=b.dataset.logstatus; render(); }));
  v.querySelectorAll('[data-toggle-log]').forEach(b=>b.addEventListener('click',()=>{
    const l = state.logbook.find(x=>x.id===b.dataset.toggleLog);
    safeUpdate('logbook/'+b.dataset.toggleLog, {status: (l&&l.status==='resolved')?'open':'resolved'});
  }));
  v.querySelectorAll('[data-del-log]').forEach(b=>b.addEventListener('click',()=>safeDelete('logbook/'+b.dataset.delLog)));

  // PASSWORDS
  const pwForm = v.querySelector('#pwForm');
  if(pwForm) pwForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(pwForm);
    await safeAdd('passwordsLinks', {name:fd.get('name'), category:fd.get('category')||"", url:fd.get('url')||"", username:fd.get('username')||"", password:fd.get('password')||"", notes:fd.get('notes')||""});
    pwForm.reset();
  });
  v.querySelectorAll('[data-reveal-pw]').forEach(b=>b.addEventListener('click',()=>{ state.revealedPw[b.dataset.revealPw]=!state.revealedPw[b.dataset.revealPw]; render(); }));
  v.querySelectorAll('[data-copy-pw]').forEach(b=>b.addEventListener('click',()=>{
    const p = state.passwords.find(x=>x.id===b.dataset.copyPw);
    if(p && navigator.clipboard){ navigator.clipboard.writeText(p.password||"").catch(()=>{}); }
  }));
  v.querySelectorAll('[data-del-pw]').forEach(b=>b.addEventListener('click',()=>safeDelete('passwordsLinks/'+b.dataset.delPw)));

  // BLACKLIST
  const blForm = v.querySelector('#blForm');
  if(blForm) blForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(blForm);
    await safeAdd('blacklist', {name:fd.get('name'), addedBy:fd.get('addedBy')||"", reason:fd.get('reason')||"", dateAdded:todayStr()});
    blForm.reset();
  });
  const blSearch = v.querySelector('#blSearchInput');
  if(blSearch) blSearch.addEventListener('input', ()=>{ state.blacklistSearch = blSearch.value; render(); blSearch.focus(); blSearch.setSelectionRange(blSearch.value.length,blSearch.value.length); });
  v.querySelectorAll('[data-del-bl]').forEach(b=>b.addEventListener('click',()=>safeDelete('blacklist/'+b.dataset.delBl)));

  const activitySearchInput = v.querySelector('#activitySearchInput');
  if(activitySearchInput) activitySearchInput.addEventListener('input', ()=>{
    state.activitySearch = activitySearchInput.value;
    render();
    const el = v.querySelector('#activitySearchInput');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  v.querySelectorAll('[data-activitytype]').forEach(b=>b.addEventListener('click', ()=>{
    state.activityTypeFilter = b.dataset.activitytype;
    render();
  }));
  const toggleMonthlyReport = v.querySelector('#toggleMonthlyReport');
  if(toggleMonthlyReport) toggleMonthlyReport.addEventListener('click', ()=>{
    state.uiShowMonthlyReport = !state.uiShowMonthlyReport;
    if(state.uiShowMonthlyReport && !state.reportMonth) state.reportMonth = monthKey();
    render();
  });
  const reportMonthInput = v.querySelector('#reportMonthInput');
  if(reportMonthInput) reportMonthInput.addEventListener('change', ()=>{
    state.reportMonth = reportMonthInput.value;
    render();
  });
}

init();
</script>
</body>
</html>
